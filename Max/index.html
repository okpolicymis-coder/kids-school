<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max's Lessons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
        }
        
        .home-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .home-btn:hover {
            background: #5568d3;
        }
        
        .content {
            color: #666;
            line-height: 1.6;
        }
        
        .lesson-link, .btn {
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        
        .lesson-link:hover, .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .login-form {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        
        .login-form.active {
            display: block;
        }
        
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .login-form button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        
        .login-form button:hover {
            background: #5568d3;
        }
        
        .error {
            color: #d32f2f;
            margin-top: 10px;
            font-weight: bold;
        }
        
        .authenticated {
            display: none;
        }
        
        .authenticated.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Max's Lessons</h1>
            <a href="../" class="home-btn">← Home</a>
        </div>
        
        <div class="content">
            <p>Welcome, Max! 👋</p>
            <p style="margin-top: 20px;">Get ready to build your reading and spelling skills this summer!</p>
            
            <button class="btn" onclick="toggleLogin()">Enter Password</button>
            
            <div class="login-form" id="loginForm">
                <input type="password" id="passwordInput" placeholder="Enter password" onkeypress="handleKeyPress(event)">
                <button onclick="checkPassword()">Login</button>
                <div class="error" id="errorMsg"></div>
            </div>
            
            <div class="authenticated" id="authenticatedContent">
                <a href="assessment.html" class="lesson-link">Start Assessment →</a>
            </div>
        </div>
    </div>
    
    <script>
        function toggleLogin() {
            document.getElementById('loginForm').classList.toggle('active');
            document.getElementById('passwordInput').focus();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }
        
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const correctPassword = 'Notyours67!';
            
            if (password === correctPassword) {
                document.getElementById('loginForm').classList.remove('active');
                document.getElementById('authenticatedContent').classList.add('active');
                localStorage.setItem('maxAuthenticated', 'true');
            } else {
                document.getElementById('errorMsg').textContent = 'Incorrect password. Try again.';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        // Check if already authenticated on page load
        window.addEventListener('load', function() {
            if (localStorage.getItem('maxAuthenticated') === 'true') {
                document.getElementById('authenticatedContent').classList.add('active');
            }
        });
    </script>
</body>
</html>
