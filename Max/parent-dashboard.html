<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .header {
            display: none;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        .header.visible {
            display: block;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        /* LOGIN FORM - FULL SCREEN */
        .login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        
        .login-section.hidden {
            display: none;
        }
        
        .login-form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-form-container h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin: 20px 0;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .error-msg {
            color: #d32f2f;
            font-size: 0.9em;
            margin-top: 8px;
            min-height: 20px;
        }
        
        .login-btn, .logout-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .login-btn:hover, .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .toggle-login-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .toggle-login-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        /* AUTHENTICATED CONTENT */
        .authenticated-content {
            display: none;
        }
        
        .authenticated-content.active {
            display: block;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .reading-passage {
            background: white;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            margin: 15px 0;
            border: 2px solid #ddd;
        }
        
        .notes-area {
            background: white;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            min-height: 150px;
            margin-top: 15px;
            font-family: inherit;
            font-size: 0.95em;
        }
        
        .word-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .word-list p {
            margin: 12px 0;
            font-size: 1.05em;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .assessment-guide {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.7;
        }
        
        .assessment-guide h3 {
            color: #667eea;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .assessment-guide ul, .assessment-guide ol {
            margin-left: 25px;
            margin-bottom: 15px;
        }
        
        .assessment-guide li {
            margin: 8px 0;
        }
        
        .logout-btn {
            width: 100%;
            max-width: 300px;
            margin: 30px auto;
        }
        
        .checklist {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .checklist-item {
            margin: 10px 0;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        
        .checklist-item input[type="checkbox"] {
            margin-right: 10px;
        }
        
        .observation-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #1976D2;
        }
        
        .observation-box strong {
            color: #1976D2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
                <h1>📊 Parent Dashboard</h1>
                <p style="color: #666; margin-top: 5px;">Manage Max's Assessment Results</p>
            </div>
            <a href="../" style="padding: 10px 20px; background: #667eea; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">← Home</a>
        </div>
        
        <!-- LOGIN SECTION - FULL SCREEN INITIALLY -->
        <div class="login-section" id="loginSection">
            <div class="login-form-container">
                <h2>Dashboard Access</h2>
                <div class="form-group">
                    <label for="passwordInput">Enter Password:</label>
                    <input type="password" id="passwordInput" placeholder="Enter password..." />
                    <div class="error-msg" id="errorMsg"></div>
                </div>
                <button class="login-btn" onclick="checkPassword()">Access Dashboard</button>
            </div>
        </div>
        
        <!-- AUTHENTICATED CONTENT -->
        <div class="authenticated-content" id="authenticatedContent">
            
            <!-- CHILD SELECTOR -->
            <div style="margin-bottom: 20px; padding: 20px; background: #f0f0f0; border-radius: 10px;">
                <h3 style="margin-bottom: 15px; color: #333;">👦 Select Student:</h3>
                <div style="display: flex; gap: 10px;">
                    <button onclick="selectChild('Max')" class="child-btn" id="childBtn-Max" style="padding: 10px 25px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Max</button>
                    <button onclick="selectChild('Bud')" class="child-btn" id="childBtn-Bud" style="padding: 10px 25px; background: #ddd; color: #333; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Bud</button>
                </div>
            </div>
            
            <!-- WEEK SELECTOR -->
            <div id="weekSelector" style="margin-bottom: 30px; padding: 20px; background: #f9f9f9; border-radius: 10px;">
                <h3 style="margin-bottom: 15px; color: #333;">📅 Select Week:</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="selectWeek(1)" class="week-btn active" data-week="1" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">Week 1</button>
                    <button onclick="selectWeek(2)" class="week-btn" data-week="2" style="padding: 10px 20px; background: #ddd; color: #333; border: none; border-radius: 8px; cursor: pointer;">Week 2</button>
                    <button onclick="selectWeek(3)" class="week-btn" data-week="3" style="padding: 10px 20px; background: #ddd; color: #333; border: none; border-radius: 8px; cursor: pointer;">Week 3</button>
                </div>
            </div>
            
            <!-- LESSON CONTENT & ATTEMPTS -->
            <div id="lessonContent"></div>
            
            <!-- LOGOUT -->
            <div style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #ddd; text-align: center;">
                <button class="logout-btn" onclick="logout()" style="padding: 10px 20px; background: #999; color: white; border: none; border-radius: 8px; cursor: pointer;">Logout</button>
            </div>
        </div>
    </div>
    
    <script>
        // LESSON CONTEXT DATA
        const lessonContent = {
            Max: {
                1: {
                    'Reading': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #667eea; margin-bottom: 15px;">📖 Reading Passage & Questions</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px; line-height: 1.8;">
                                <strong>The Great Migration of Monarch Butterflies</strong><br><br>
                                <div style="margin: 12px 0;"><strong>1.</strong> Every fall, millions of monarch butterflies embark on one of nature's most remarkable journeys.</div>
                                <div style="margin: 12px 0;"><strong>2.</strong> These delicate insects migrate thousands of miles from Canada and the northern United States to the mountains of central Mexico.</div>
                                <div style="margin: 12px 0;"><strong>3.</strong> Scientists have long been fascinated by how monarchs accomplish this incredible feat without a map or GPS.</div>
                                <div style="margin: 12px 0;"><strong>4.</strong> The butterflies navigate using the sun's position and the Earth's magnetic field.</div>
                                <div style="margin: 12px 0;"><strong>5.</strong> What makes this migration even more astounding is that no single butterfly completes the entire round trip.</div>
                            </div>
                            <p style="margin-top: 15px; color: #666; font-size: 0.95em;"><strong>Note:</strong> Max answers comprehension questions about this passage and provides evidence (sentence numbers) for his answers.</p>
                        </div>
                    `,
                    'Spelling': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #667eea; margin-bottom: 15px;">🔤 Spelling Words</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                                <p style="margin-bottom: 15px;"><strong>Max spells these 12 words:</strong></p>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                    <div>1. action</div>
                                    <div>2. decision</div>
                                    <div>3. special</div>
                                    <div>4. picture</div>
                                    <div>5. bicycle</div>
                                    <div>6. energy</div>
                                    <div>7. running</div>
                                    <div>8. complete</div>
                                    <div>9. family</div>
                                    <div>10. discover</div>
                                    <div>11. visible</div>
                                    <div>12. transport</div>
                                </div>
                            </div>
                        </div>
                    `,
                    'Writing': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #667eea; margin-bottom: 15px;">✍️ Writing Prompts</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                                <p style="margin-bottom: 15px;"><strong>Max writes about his favorite hobby in 5 sentences:</strong></p>
                                <ol style="line-height: 1.8;">
                                    <li>What is your favorite game, show, or hobby?</li>
                                    <li>Why do you like it? What's fun about it?</li>
                                    <li>Give a specific example or detail about it.</li>
                                    <li>How does it make you feel?</li>
                                    <li>Would you recommend it to someone else? Why or why not?</li>
                                </ol>
                            </div>
                        </div>
                    `
                }
            },
            Bud: {
                1: {
                    'Reading': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #f5576c; margin-bottom: 15px;">📖 Understanding the Scientific Method</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px; line-height: 1.8;">
                                <strong>What Bud is Learning:</strong><br><br>
                                <p style="margin: 12px 0;">Bud is learning the 6 steps of the scientific method: Ask a Question, Do Research, Make a Hypothesis, Do an Experiment, Draw a Conclusion, and Repeat.</p>
                                <p style="margin: 12px 0;"><strong>Key Focus:</strong> The lesson emphasizes HOW to think scientifically—understanding the reasoning behind each step, rather than memorizing facts.</p>
                                <p style="margin: 12px 0;"><strong>Why this matters:</strong> Critical thinking and asking good questions are skills that apply to everything in life, from solving everyday problems to understanding how the world works.</p>
                            </div>
                            <p style="margin-top: 15px; color: #666; font-size: 0.95em;"><strong>What to look for:</strong> Does Bud understand the PURPOSE of each step? Can he explain WHY scientists do experiments? Does he see the connections between steps?</p>
                        </div>
                    `,
                    'Vocabulary': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #f5576c; margin-bottom: 15px;">📚 Scientific Vocabulary Matching</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                                <p style="margin-bottom: 15px;"><strong>Bud matches 8 scientific terms to their definitions:</strong></p>
                                <p style="margin: 12px 0;"><em>These words are essential to scientific thinking: Hypothesis, Variable, Observation, Evidence, Conclusion, Control, Data, Experiment.</em></p>
                                <p style="margin-top: 15px; color: #666; font-size: 0.95em;"><strong>What to look for:</strong> Accuracy in matching terms to definitions shows Bud understands the tools scientists use. This demonstrates conceptual understanding rather than memorization.</p>
                            </div>
                        </div>
                    `,
                    'Experiment': `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #f5576c; margin-bottom: 15px;">🧪 Design Your Own Experiment</h3>
                            <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                                <p style="margin-bottom: 15px;"><strong>Bud designs his own experiment in 5 steps:</strong></p>
                                <ol style="margin-left: 20px; line-height: 1.8;">
                                    <li>Ask a Question: What is he curious about?</li>
                                    <li>Make a Hypothesis: What does he predict?</li>
                                    <li>Identify the Variable: What will he change?</li>
                                    <li>Plan the Control: What will stay the same?</li>
                                    <li>Describe Measurements: How will he measure results?</li>
                                </ol>
                                <p style="margin-top: 15px; color: #666; font-size: 0.95em;"><strong>What to look for:</strong> Does his experiment design make logical sense? Can he identify ONE variable to change? Does he understand why a control is needed? This shows whether Bud can APPLY the scientific method to real problems.</p>
                            </div>
                        </div>
                    `
                }
            }
        };
        
        // Check if already authenticated
        let selectedChild = 'Max';
        let selectedWeek = 1;
        
        if (localStorage.getItem('dashboardAuthenticated') === 'true') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('header').classList.add('visible');
            document.getElementById('authenticatedContent').classList.add('active');
            selectWeek(1);
        }
        
        // Password check
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const correctPassword = 'Dashboard123!';
            
            if (password === correctPassword) {
                document.getElementById('passwordInput').addEventListener('keypress', handleKeyPress);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('header').classList.add('visible');
                document.getElementById('authenticatedContent').classList.add('active');
                localStorage.setItem('dashboardAuthenticated', 'true');
                document.getElementById('errorMsg').textContent = '';
                selectWeek(1);
            } else {
                document.getElementById('errorMsg').textContent = 'Incorrect password. Try again.';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }
        
        document.getElementById('passwordInput').addEventListener('keypress', handleKeyPress);
        
        // Child selection
        function selectChild(child) {
            selectedChild = child;
            document.querySelectorAll('.child-btn').forEach(btn => {
                btn.style.background = '#ddd';
                btn.style.color = '#333';
            });
            document.getElementById('childBtn-' + child).style.background = '#667eea';
            document.getElementById('childBtn-' + child).style.color = 'white';
            selectWeek(selectedWeek);
        }
        
        // Week selection
        function selectWeek(weekNum) {
            selectedWeek = weekNum;
            // Update button styles
            document.querySelectorAll('.week-btn').forEach(btn => {
                if (btn.dataset.week == weekNum) {
                    btn.style.background = '#667eea';
                    btn.style.color = 'white';
                    btn.classList.add('active');
                } else {
                    btn.style.background = '#ddd';
                    btn.style.color = '#333';
                    btn.classList.remove('active');
                }
            });
            
            // Load lesson content for this week
            loadLessonContent(weekNum);
            fetchAttemptsForWeek(weekNum);
        }
        
        function loadLessonContent(weekNum) {
            const childContent = lessonContent[selectedChild];
            const content = childContent ? childContent[weekNum] : null;
            if (!content) {
                document.getElementById('lessonContent').innerHTML = `<p style="color: #999; padding: 20px;">No lesson content configured for ${selectedChild} Week ${weekNum} yet.</p>`;
                return;
            }
            
            let html = `<h2 style="margin-bottom: 25px; color: #333;">📚 Week ${weekNum} - Lesson Context</h2>`;
            html += '<div style="display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px;">';
            
            // Get section names based on child
            let section1Name = selectedChild === 'Max' ? 'Reading' : 'Reading';
            let section2Name = selectedChild === 'Max' ? 'Spelling' : 'Vocabulary';
            let section3Name = selectedChild === 'Max' ? 'Writing' : 'Experiment';
            let section1Icon = selectedChild === 'Max' ? '📖' : '📖';
            let section2Icon = selectedChild === 'Max' ? '🔤' : '📚';
            let section3Icon = selectedChild === 'Max' ? '✍️' : '🧪';
            
            // Section 1
            html += `<div style="border: 2px solid ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; border-radius: 10px; overflow: hidden;">
                <button onclick="toggleSection('section1-context')" style="width: 100%; padding: 15px; background: ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; color: white; border: none; cursor: pointer; font-size: 1em; font-weight: bold; text-align: left;">${section1Icon} ${section1Name} Context</button>
                <div id="section1-context" style="padding: 20px; display: none; background: white;">${content[section1Name] || content['Reading']}</div>
            </div>`;
            
            // Section 2
            html += `<div style="border: 2px solid ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; border-radius: 10px; overflow: hidden;">
                <button onclick="toggleSection('section2-context')" style="width: 100%; padding: 15px; background: ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; color: white; border: none; cursor: pointer; font-size: 1em; font-weight: bold; text-align: left;">${section2Icon} ${section2Name} Context</button>
                <div id="section2-context" style="padding: 20px; display: none; background: white;">${content[section2Name] || content['Spelling']}</div>
            </div>`;
            
            // Section 3
            html += `<div style="border: 2px solid ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; border-radius: 10px; overflow: hidden;">
                <button onclick="toggleSection('section3-context')" style="width: 100%; padding: 15px; background: ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; color: white; border: none; cursor: pointer; font-size: 1em; font-weight: bold; text-align: left;">${section3Icon} ${section3Name} Context</button>
                <div id="section3-context" style="padding: 20px; display: none; background: white;">${content[section3Name] || content['Writing']}</div>
            </div>`;
            
            html += '</div>';
            
            // Attempts section
            html += `<h3 style="margin-top: 40px; margin-bottom: 15px; color: #333; border-top: 2px solid #ddd; padding-top: 20px;">📊 ${selectedChild}'s Attempts</h3>`;
            html += '<div id="attemptsList" style="display: flex; flex-direction: column; gap: 10px;"></div>';
            
            // File upload section
            html += `<hr style="margin: 30px 0; border: none; border-top: 2px solid #ddd;">
            <h3 style="margin-bottom: 15px; color: #333;">📁 Or Upload a JSON File</h3>
            <div style="border: 2px dashed ${selectedChild === 'Max' ? '#667eea' : '#f5576c'}; padding: 20px; border-radius: 10px; text-align: center; background: #f9f9f9;">
                <input type="file" id="fileUpload" accept=".json" style="display: none;" onchange="handleFileUpload(event)">
                <button onclick="document.getElementById('fileUpload').click()" style="padding: 12px 25px; background: linear-gradient(135deg, ${selectedChild === 'Max' ? '#667eea 0%, #764ba2' : '#f093fb 0%, #f5576c'} 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                    📁 Choose File
                </button>
            </div>`;
            
            document.getElementById('lessonContent').innerHTML = html;
        }
        
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.style.display = section.style.display === 'none' ? 'block' : 'none';
            }
        }
        
        // Fetch attempts for specific week
        function fetchAttemptsForWeek(weekNum) {
            const attemptsList = document.getElementById('attemptsList');
            if (!attemptsList) return;
            
            attemptsList.innerHTML = '<p style="color: #999;">Loading attempts...</p>';
            
            fetch(`https://raw.githubusercontent.com/okpolicymis-coder/kids-school/main/${selectedChild}/attempts.json`)
                .then(response => {
                    if (response.status === 404) {
                        attemptsList.innerHTML = '<p style="color: #999;">No attempts saved yet.</p>';
                        return null;
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && Array.isArray(data)) {
                        window.allAttempts = data;
                        const weekAttempts = data.filter(a => a.week == weekNum);
                        if (weekAttempts.length > 0) {
                            displayAttemptsList(weekAttempts);
                        } else {
                            attemptsList.innerHTML = '<p style="color: #999;">No attempts for this week yet.</p>';
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching attempts:', error);
                    attemptsList.innerHTML = '<p style="color: #d32f2f;">Could not load attempts from GitHub.</p>';
                });
        }
        
        // Display list of attempts
        function displayAttemptsList(attempts) {
            const attemptsList = document.getElementById('attemptsList');
            if (!attemptsList) return;
            
            let html = '';
            attempts.forEach((attempt) => {
                const date = new Date(attempt.timestamp);
                const timeStr = date.toLocaleString();
                const globalIndex = window.allAttempts ? window.allAttempts.indexOf(attempt) : 0;
                html += `<button onclick="loadAttempt(${globalIndex})" style="padding: 12px; background: #f5f5f5; border: 2px solid #ddd; border-radius: 5px; cursor: pointer; text-align: left; width: 100%;">
                    <strong>${attempt.part}</strong> — ${timeStr}
                </button>`;
            });
            
            attemptsList.innerHTML = html || '<p style="color: #999;">No attempts available.</p>';
        }
        
        // Load specific attempt
        function loadAttempt(index) {
            if (!window.allAttempts || !window.allAttempts[index]) {
                alert('Attempt not found');
                return;
            }
            displayResults(window.allAttempts[index]);
        }
        
        // Handle file upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    displayResults(data);
                } catch (error) {
                    alert('Invalid JSON file.');
                    console.error('JSON parse error:', error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        // Display results
        function displayResults(data) {
            if (!data.answers) {
                alert('Invalid assessment file format.');
                return;
            }
            
            const date = new Date(data.timestamp);
            const timeStr = date.toLocaleString();
            
            let html = `<div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                <h2 style="color: #333; margin-bottom: 10px;">Week ${data.week} - ${data.part}</h2>
                <p style="color: #666;"><strong>Completed:</strong> ${timeStr}</p>
            </div>`;
            
            // Reading
            if (data.answers.reading && Object.keys(data.answers.reading).length > 0) {
                html += '<div style="margin-bottom: 25px;"><h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 10px;">📖 Reading Comprehension</h3>';
                for (let i = 1; i <= 5; i++) {
                    const sentence = data.answers.reading[`sentence${i}`];
                    html += `<div style="margin: 12px 0; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                        <strong>Q${i}:</strong> ${data.answers.reading[`answer${i}`] || '(no answer)'}
                        ${sentence ? `<br><small style="color: #666;">Sentence(s): ${sentence}</small>` : ''}
                    </div>`;
                }
                html += '</div>';
            }
            
            // Spelling (Max)
            if (data.answers.spelling && Object.keys(data.answers.spelling).length > 0) {
                html += '<div style="margin-bottom: 25px;"><h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 10px;">🔤 Spelling</h3>';
                const correctWords = ['action', 'decision', 'special', 'picture', 'bicycle', 'energy', 'running', 'complete', 'family', 'discover', 'visible', 'transport'];
                let correct = 0, total = 0;
                for (let i = 1; i <= 12; i++) {
                    const userAnswer = data.answers.spelling[`spelling${i}`] || '';
                    const correctWord = correctWords[i-1];
                    const isCorrect = userAnswer.toLowerCase() === correctWord.toLowerCase();
                    if (isCorrect) correct++;
                    if (userAnswer) total++;
                    html += `<div style="margin: 8px 0; padding: 8px; background: ${isCorrect ? '#e8f5e9' : '#fff3cd'}; border-radius: 5px; border-left: 4px solid ${isCorrect ? '#4caf50' : '#ff9800'};">
                        <strong>${i}. ${correctWord}</strong> — ${isCorrect ? '✓ Correct!' : `typed: "${userAnswer || '(blank)'}"`}
                    </div>`;
                }
                html += `<div style="margin-top: 15px; padding: 12px; background: #e3f2fd; border-radius: 5px;"><strong>Score: ${correct}/${total || 12} correct</strong></div>`;
                html += '</div>';
            }
            
            // Writing (Max)
            if (data.answers.writing && Object.keys(data.answers.writing).length > 0) {
                html += '<div style="margin-bottom: 25px;"><h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 10px;">✍️ Writing</h3>';
                for (let i = 1; i <= 5; i++) {
                    const writing = data.answers.writing[`writing${i}`] || '(no answer)';
                    html += `<div style="margin: 12px 0; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                        <strong>Sentence ${i}:</strong><br>
                        <em>${writing}</em>
                    </div>`;
                }
                html += '</div>';
            }
            
            // Vocabulary (Bud)
            if (data.answers.vocabulary && Object.keys(data.answers.vocabulary).length > 0) {
                const vocabTerms = ['Hypothesis', 'Variable', 'Observation', 'Evidence', 'Conclusion', 'Control', 'Data', 'Experiment'];
                html += '<div style="margin-bottom: 25px;"><h3 style="color: #f5576c; border-bottom: 2px solid #f5576c; padding-bottom: 10px;">📚 Vocabulary Matching</h3>';
                for (let i = 1; i <= 8; i++) {
                    const answer = data.answers.vocabulary[`vocabulary${i}`] || '(blank)';
                    html += `<div style="margin: 8px 0; padding: 8px; background: #f9f9f9; border-radius: 5px;">
                        <strong>${i}. ${vocabTerms[i-1]}:</strong> answered ${answer}
                    </div>`;
                }
                html += '</div>';
            }
            
            // Experiment Design (Bud)
            if (data.answers.experiment && Object.keys(data.answers.experiment).length > 0) {
                const steps = ['Question', 'Hypothesis', 'Variable to Change', 'Things to Keep the Same', 'How to Measure'];
                html += '<div style="margin-bottom: 25px;"><h3 style="color: #f5576c; border-bottom: 2px solid #f5576c; padding-bottom: 10px;">🧪 Experiment Design</h3>';
                for (let i = 1; i <= 5; i++) {
                    const answer = data.answers.experiment[`step${i}`] || '(no answer)';
                    html += `<div style="margin: 12px 0; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                        <strong>Step ${i}: ${steps[i-1]}</strong><br>
                        <em>${answer}</em>
                    </div>`;
                }
                html += '</div>';
            }
            
            // Display modal or full screen
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;';
            modal.innerHTML = `<div style="background: white; border-radius: 15px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px;">
                ${html}
                <button onclick="this.closest('[role=dialog]')?.remove()" style="margin-top: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">Close</button>
            </div>`;
            modal.setAttribute('role', 'dialog');
            document.body.appendChild(modal);
        }
        
        // Logout
        function logout() {
            localStorage.removeItem('dashboardAuthenticated');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('header').classList.remove('visible');
            document.getElementById('authenticatedContent').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('passwordInput').focus();
        }
    </script>
</body>
</html>
